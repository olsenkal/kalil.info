baseURL = "https://kalil.info/"
locale = "en-us"
title = "Kalil Olsen"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[services.rss]
  limit = 20

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = true
  style = "dracula"

[params]
  # TODO: rewrite in your own words. This one line is the most important text on the site.
  tagline = "Hi, I'm Kalil."
  subtagline = "I write about homelabs, how-tos, and the work I do."
  description = "Personal site of Kalil Olsen: writing, projects, and homelab notes."
  author = "Kalil Olsen"
  # Default share-card image (put a 1200x630 PNG at static/og-default.png).
  ogImage = "og-default.png"
  # Contact hub. Empty values are hidden.
  email = ""
  [params.socials]
    github = ""
    linkedin = ""
    mastodon = ""
    instagram = ""

  # "Start here" cards on the homepage. TODO: point these at your best pages.
  [[params.startHere]]
    title = "What I run at home"
    url = "/homelab/"
    blurb = "Hardware, network, and services, with the write-ups behind them."
  [[params.startHere]]
    title = "Selected work"
    url = "/projects/"
    blurb = "Case studies: the problem, what I did, and what changed."
  [[params.startHere]]
    title = "Experience"
    url = "/resume/"
    blurb = "Roles, outcomes, and skills."

[menus]
  [[menus.main]]
    name = "Writing"
    pageRef = "/posts"
    weight = 10
  [[menus.main]]
    name = "Homelab"
    pageRef = "/homelab"
    weight = 15
  [[menus.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 20
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 40
  [[menus.main]]
    name = "Contact"
    pageRef = "/contact"
    weight = 50
  [[menus.footer]]
    name = "Now"
    pageRef = "/now"
    weight = 10
  [[menus.footer]]
    name = "Uses"
    pageRef = "/uses"
    weight = 20
  [[menus.footer]]
    name = "Gallery"
    pageRef = "/gallery"
    weight = 25
  [[menus.footer]]
    name = "Résumé"
    pageRef = "/resume"
    weight = 30
