baseURL = "https://kalil.info/"
locale = "en-us"
title = "Kalil Olsen"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[services.rss]
  limit = 20

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = true
  style = "dracula"

[params]
  # TODO: tagline and subtagline are placeholders; Kalil will supply the final copy. Do not edit until then.
  # TODO: rewrite in your own words. This one line is the most important text on the site.
  tagline = "Hi, I'm Kalil."
  subtagline = "I write about homelabs, how-tos, and the work I do."
  description = "Personal site of Kalil Olsen: writing, projects, and homelab notes."
  author = "Kalil Olsen"
  # Default share-card image (put a 1200x630 PNG at static/og-default.png).
  ogImage = "og-default.png"
  # Contact hub. Empty values are hidden.
  email = ""
  [params.socials]
    github = ""
    linkedin = ""
    mastodon = ""
    instagram = ""

  # Audience doors on the homepage. A link with `ifPage` renders only when that page exists.
  [[params.startHere]]
    title = "Work"
    blurb = "For recruiters and clients: experience, outcomes, and how to get in touch."
    [[params.startHere.links]]
      title = "Resume"
      url = "/resume/"
  [[params.startHere]]
    title = "Build"
    blurb = "For peers: case studies and what I run at home."
    [[params.startHere.links]]
      title = "Projects"
      url = "/projects/"
    [[params.startHere.links]]
      title = "Homelab"
      url = "/homelab/"
  [[params.startHere]]
    title = "Life"
    blurb = "For friends and family: life posts, pictures, and music."
    [[params.startHere.links]]
      title = "Life posts"
      url = "/categories/life/"
      ifPage = "/categories/life"
    [[params.startHere.links]]
      title = "Gallery"
      url = "/gallery/"
    [[params.startHere.links]]
      title = "Music"
      url = "/music/"

[menus]
  [[menus.main]]
    name = "Writing"
    pageRef = "/writing"
    weight = 10
  [[menus.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 20
  [[menus.main]]
    name = "Homelab"
    pageRef = "/homelab"
    weight = 30
  [[menus.main]]
    name = "Resume"
    pageRef = "/resume"
    weight = 40
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 50
  [[menus.footer]]
    name = "Now"
    pageRef = "/now"
    weight = 10
  [[menus.footer]]
    name = "Uses"
    pageRef = "/uses"
    weight = 20
  [[menus.footer]]
    name = "Gallery"
    pageRef = "/gallery"
    weight = 30
  [[menus.footer]]
    name = "Music"
    pageRef = "/music"
    weight = 40
  [[menus.footer]]
    name = "Contact"
    pageRef = "/contact"
    weight = 50
